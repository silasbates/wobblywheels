@media (max-width: 1200px) {
  #game {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .canvasContainer,
  .container {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    min-height: 0;
  }

  .canvasContainer {
    display: flex;
    flex-direction: column;
  }

  canvas {
    width: 100%;
    height: 100%;
  }

  #overlay-ui {
    zoom: 1;
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
  }

  #home {
    box-sizing: border-box;
    max-width: calc(100vw - 32px);
    padding: 32px 24px;
  }

  #home h1 {
    font-size: clamp(2rem, 10vw, 3.5rem);
    text-align: center;
  }

  #settings {
    box-sizing: border-box;
    width: calc(100% - 40px);
    height: calc(100% - 24px);
    max-width: 760px;
    padding: 20px 16px;
    overflow: hidden;
    -webkit-overflow-scrolling: touch;
  }
  #levels {
    box-sizing: border-box;
    width: calc(100% - 40px);
    height: calc(100% - 24px);
    max-width: 760px;
    padding: 20px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .tabs-header {
    gap: 6px;
  }

  .tab-btn {
    min-width: 0;
    padding: 10px 5px;
    font-size: 0.95rem;
  }

  .setting-group {
    margin-bottom: 16px;
  }

  .slider-row {
    gap: clamp(4px, 2vw, 12px);
  }

  .value-input {
    width: 72px;
    flex-basis: 72px;
  }

  .action-footer {
    gap: 10px;
  }

  .back-btn,
  .settings-play-btn {
    padding: 12px;
    font-size: 1rem;
  }

  button:hover,
  .btn:hover {
    transform: none;
  }
}

function OpenMenu(menu = 'home') {
  const overlayUi = document.getElementById('overlay-ui');
  const homeEl = document.getElementById('home');
  const settingsEl = document.getElementById('settings');
  
  const levelsEl = document.getElementById('levels');

  if (overlayUi) overlayUi.style.background = "rgba(0, 0, 0, 0.2)";
  if (homeEl) homeEl.style.display = 'none';
  if (settingsEl) settingsEl.style.display = 'none';
  
  if (levelsEl) levelsEl.style.display = 'none';

  if (menu === 'home' && homeEl) {
    homeEl.style.display = 'flex';
  } else if (menu === 'settings' && settingsEl) {
    settingsEl.style.display = 'flex';
  } else if (menu === 'levels' && levelsEl) {
    levelsEl.style.display = 'flex';
  }
}

function SyncFromSlider(key, val) {
  let num = parseFloat(val);
  if (key !== 'steepness' && key !== 'mapStep') {
    num = Math.round(num * 100000) / 100000;
  }
  updateGlobalState(key, num);
  const valInput = document.getElementById(`${key}-val`);
  if (valInput) valInput.value = num;
}

function SyncFromInput(key, val) {
  let num = parseFloat(val);
  if (isNaN(num)) {
    num = (key === 'steepness') ? 500 : (key === 'mapStep') ? 200 : 0.5;
  }
  
  if (key === 'steepness') {
    if (num < 0) num = 0;
    if (num > 1000) num = 1000;
    num = Math.round(num);
  } else if (key === 'mapStep') {
    if (num < 100) num = 100;
    if (num > 300) num = 300;
    num = Math.round(num);
  } else if (key === 'brittleness') {
    if (num < 1.0) num = 1.0;
    if (num > 20) num = 20;
    num = Math.round(num);
  } else if (key === 'rain') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'lightning') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'astroid') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'avalanche') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'explode') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else {
    if (num < 0.00001) num = 0.00001;
    if (num > 0.999999) num = 0.999999;
    num = Math.round(num * 100000) / 100000;
  }
  
  updateGlobalState(key, num);
  const slider = document.getElementById(`${key}Slider`);
  const valInput = document.getElementById(`${key}-val`);
  if (slider) slider.value = num;
  if (valInput) valInput.value = num;
}

function updateGlobalState(key, value) {
  if (key === 'stiffness') inputStiffness = value;
  if (key === 'restitution') inputRestitution = value;
  if (key === 'friction') inputFriction = value;
  if (key === 'steepness') inputSteepness = value;
  if (key === 'mapStep') inputMapStep = value;
  if (key === 'brittleness') inputbrittleness = value;
  if (key === 'rain') inputRain = value;
  if (key === 'lightning') inputLightning = value;
  if (key === 'astroid') inputAstroid = value;
  if (key === 'avalanche') inputAvalanche = value;
  if (key === 'explode') inputExplode = value;
 
}

function drawNeptuneWinds() {
    let canvasWidth = canvas.width;
    let canvasHeight = canvas.height;

    if (!this.windParticles) {
        this.windParticles = [];
        for (let i = 0; i < 250; i++) {
            this.windParticles.push({
                x: Math.random() * canvasWidth,
                y: Math.random() * canvasHeight,
                length: Math.random() * 500 + 300,
                speed: Math.random() * 60 + 40,
                opacity: Math.random() * 0.6 + 0.4,
                thickness: Math.random() * 8 + 4
            });
        }
    }

    let sineIntensity = (Math.sin(time * 0.02) + 1) / 2;
	neptuneWind = sineIntensity
    if (sineIntensity > 0.01) {
        let totalBlockAlpha = sineIntensity >= 0.98 ? 1.0 : sineIntensity * 0.75;
        ctx.fillStyle = `rgba(0, 45, 115, ${totalBlockAlpha})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        for (let i = 0; i < this.windParticles.length; i++) {
            let p = this.windParticles[i];
            
            let gradient = ctx.createLinearGradient(p.x, p.y, p.x + p.length, p.y);
            gradient.addColorStop(0, `rgba(30, 144, 255, 0)`);
            gradient.addColorStop(0.3, `rgba(135, 206, 250, ${p.opacity * sineIntensity})`);
            gradient.addColorStop(0.7, `rgba(255, 255, 255, ${p.opacity * 0.9 * sineIntensity})`);
            gradient.addColorStop(1, `rgba(0, 102, 204, 0)`);

            ctx.strokeStyle = gradient;
            ctx.lineWidth = p.thickness;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.length, p.y);
            ctx.stroke();

            p.x += p.speed;

            if (p.x > canvasWidth) {
                p.x = -p.length;
                p.y = Math.random() * canvasHeight;
            }
        }
    }
}




let time = 0
let marsWindStreaks = [];
let marsWindCanvasSize = "";

function getMarsWindDirection() {
    return Math.sin(time / 120) >= 0 ? 1 : -1;
}

function drawMarsWind() {
    const canvasSize = `canvas.widthx{canvas.height}`;
    if (canvasSize !== marsWindCanvasSize) {
        marsWindCanvasSize = canvasSize;
        const streakCount = Math.max(20, Math.min(180, Math.ceil(canvas.width * canvas.height / 12000)));
        marsWindStreaks = Array.from({ length: streakCount }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: 20 + Math.random() * 70,
            speed: 2 + Math.random() * 3,
            opacity: 0.25 + Math.random() * 0.4
        }));
    }

    ctx.save();
    ctx.lineWidth = 2;
    const direction = getMarsWindDirection();
    for (const streak of marsWindStreaks) {
        streak.x += streak.speed * direction;
        if (direction > 0 && streak.x > canvas.width) {
            streak.x = -streak.length;
            streak.y = Math.random() * canvas.height;
        } else if (direction < 0 && streak.x + streak.length < 0) {
            streak.x = canvas.width;
            streak.y = Math.random() * canvas.height;
        }
        ctx.strokeStyle = `rgba(255, 255, 255, ${streak.opacity})`;
        ctx.beginPath();
        ctx.moveTo(streak.x, streak.y);
        ctx.lineTo(streak.x + streak.length, streak.y);
        ctx.stroke();
    }
    ctx.restore();
}

        function makeRope(x1, y1, x2, y2, gap) {
    const dist = getDistance(x1, y1, x2, y2);
    // Determine how many balls fit in this distance
    const steps = Math.floor(dist / gap);
   
    // Calculate the normalized step for x and y
    const dx = (x2 - x1) / steps;
    const dy = (y2 - y1) / steps;
    let lastBallIndex = null;
    for (let i = 0; i <= steps; i++) {
        // Calculate current position
        const currX = x1 + (dx * i);
        const currY = y1 + (dy * i);
        const newBall = {
            x: currX,
            y: currY,
            xVel: 0,
            yVel: 0,
            radias: ballRadias,
            spring: lastBallIndex === null ?  [isNearBall(ropeX, ropeY, 50, false, true)] : [lastBallIndex],
            springDist: [gap],
            anchor: false
        };




        balls.push(newBall);
       
        // The index of the ball we just added
        const currentIdx = balls.length - 1;


        // Link the previous ball to this new ball (bidirectional spring)
        if (lastBallIndex !== null) {
            balls[lastBallIndex].spring.push(currentIdx);
            balls[lastBallIndex].springDist.push(gap);
        }




        lastBallIndex = currentIdx;
    }
}

    if (ball1.xVel === "anchor" && ball2.xVel === "anchor") return;
   
    const dx = ball1.x - ball2.x;
    const dy = ball1.y - ball2.y;
    const distance = Math.hypot(dx, dy);
    const minDistance = ball1.radias + ball2.radias;
    if (distance < minDistance && distance > 0) {
        const overlap = minDistance - distance;
        const nx = dx / distance;
        const ny = dy / distance;
	

        if (ball1.xVel !== "anchor") {
            ball1.x += nx * overlap * 0.5;
            ball1.y += ny * overlap * 0.5;
        }
        if (ball2.xVel !== "anchor") {
            ball2.x -= nx * overlap * 0.5;
            ball2.y -= ny * overlap * 0.5;
        }
        const v1x = ball1.xVel === "anchor" ? 0 : ball1.xVel;
        const v1y = ball1.yVel === "anchor" ? 0 : ball1.yVel;
        const v2x = ball2.xVel === "anchor" ? 0 : ball2.xVel;
        const v2y = ball2.yVel === "anchor" ? 0 : ball2.yVel;
        const relVelX = v1x - v2x;
        const relVelY = v1y - v2y;
        const velAlongNormal = (relVelX * nx) + (relVelY * ny);
        if (velAlongNormal > 0) return;
        const impulse = -(1 + restitution) * velAlongNormal / 2;
       
        if (ball1.xVel !== "anchor") {
            ball1.xVel += impulse * nx;
            ball1.yVel += impulse * ny;
        }
        if (ball2.xVel !== "anchor") {
            ball2.xVel -= impulse * nx;

function deleteTemp() {

function deleteBall(ballIndex) {
    for (let b of balls) {
        for (let i = b.spring.length - 1; i >= 0; i--) {
            if (b.spring[i] === ballIndex) {
                b.spring.splice(i, 1);
                b.springDists.splice(i, 1);
            } else if (b.spring[i] > ballIndex) {
                b.spring[i]--;
            }
        }
    }

    if (target > ballIndex) {
        target--;
    }
    if (otherVeiw > ballIndex) {
        otherVeiw--;
    }

    balls.splice(ballIndex, 1);
}


































function drawBg(CTX = ctx, CANVAS = canvas) {
  /*// 1. Handle Scrolling and Infinite Loop Physics
  distanceBg -= (speed - 0.3045) * 3;
  if (distanceBg - 540 < -540) {
    distanceBg -= Math.floor((distanceBg - 540) / -540) * -540;
  }
  */

  const mountainData = [
    { color: m.mountainColors[0], x1: -20, x2: 60, x3: 140, h: 80},
    { color: m.mountainColors[1], x1: 80, x2: 160, x3: 240, h: 110},
    { color: m.mountainColors[2], x1: 180, x2: 270, x3: 360, h: 75},
    { color: m.mountainColors[3], x1: 300, x2: 400, x3: 500, h: 130},
    { color: m.mountainColors[4], x1: 420, x2: 510, x3: 600, h: 95}
  ];

  // sky
  let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
  const isZeroGravitySky = m.name === "zero gravity";
  const targetSkyBlend = isZeroGravitySky && noGravity > 0 ? 1 : 0;
  zeroGravitySkyBlend += (targetSkyBlend - zeroGravitySkyBlend) * 0.06;
  const blendSkyColor = (baseColor, purpleColor) => {
    const base = Number.parseInt(baseColor.slice(1), 16);
    const purple = Number.parseInt(purpleColor.slice(1), 16);
    const channel = shift => Math.round(
      ((base >> shift) & 255) * (1 - zeroGravitySkyBlend) +
      ((purple >> shift) & 255) * zeroGravitySkyBlend
    );
    return `rgb(${channel(16)}, ${channel(8)}, ${channel(0)})`;
  };
  const skyColor = isZeroGravitySky ? blendSkyColor(m.skyColor, "#32104f") : m.skyColor;
  const sunsetColor = isZeroGravitySky ? blendSkyColor(m.sunsetColor, "#8a3db5") : m.sunsetColor;
  skyGradient.addColorStop(0, skyColor);
  //skyGradient.addColorStop(0.4, "#73aed9");
  //skyGradient.addColorStop(0.75, "#f79e45");
  skyGradient.addColorStop(0.85, sunsetColor);
  skyGradient.addColorStop(1, sunsetColor);
  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
		
  // sun
  if (m.drawSun) {
  ctx.fillStyle = '#ffb';
  ctx.strokeStyle = "black";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(canvas.width - 120, (canvas.height / 2) - 100, 50, 0, 2 * Math.PI);
  ctx.fill();
  ctx.stroke();
	}
  ctx.lineJoin = "round";
  const baseY = canvas.height / 2 + 15;
  const offsets = [];

  for (let offset = -540; offset < canvas.width; offset += 540) {
    offsets.push(offset);
  }

  // mountains
  for (let offset of offsets) {
    for (let m of mountainData) {
      ctx.fillStyle = m.color;
      ctx.strokeStyle = "black";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0 + m.x1 + offset, baseY);
      ctx.lineTo(0 + m.x2 + offset, baseY - m.h);
      ctx.lineTo(0 + m.x3 + offset, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  // ground
  ctx.fillStyle = m.grassColor;
  ctx.fillRect(0, baseY, canvas.width, canvas.height - baseY);

  // horizon
  ctx.strokeStyle = "black";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.lineTo(canvas.width, baseY);
  ctx.stroke();

  for (let offset of offsets) {
    const startX = 0 + offset;
    const endX = 540 + offset;
    // shore
    if (m.drawShore) {
    	ctx.fillStyle = m.sandColor;
    	ctx.beginPath();
    	ctx.moveTo(startX, baseY + 30);
    	ctx.bezierCurveTo(
      	startX + 180, baseY + 90,
      	startX + 360, baseY - 10,
     		endX, baseY + 30
    	);
    	ctx.lineTo(endX, canvas.height);
    	ctx.lineTo(startX, canvas.height);
    	ctx.closePath();
    	ctx.fill();
    	ctx.strokeStyle = "black";
    	ctx.lineWidth = 5;
   		ctx.beginPath();
    	ctx.moveTo(startX, baseY + 30);
    	ctx.bezierCurveTo(startX + 180, baseY + 90, startX + 360, baseY - 10, 	endX, baseY + 30);
    	ctx.stroke();
    }

    // water
	if (m.waterColor) {
    let lakeGradient = ctx.createLinearGradient(0, baseY + 80, 0, canvas.height);
    lakeGradient.addColorStop(0, m.waterColor);
    ctx.fillStyle = lakeGradient;
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 90);
    ctx.bezierCurveTo(
      startX + 180, baseY + 150,
      startX + 360, baseY + 50,
      endX, baseY + 90
    );
    ctx.lineTo(endX, canvas.height);
    ctx.lineTo(startX, canvas.height);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "black";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 90);
    ctx.bezierCurveTo(startX + 180, baseY + 150, startX + 360, baseY + 50, endX, baseY + 90);
    ctx.stroke();
	
    // wave
    ctx.fillStyle = "rgba(78, 182, 194, 0.45)";
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 80);
    ctx.bezierCurveTo(
      startX + 180, baseY + 140,
      startX + 360, baseY + 40,
      endX, baseY + 80
    );
    ctx.lineTo(endX, canvas.height);
    ctx.lineTo(startX, canvas.height);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 80);
    ctx.bezierCurveTo(startX + 180, baseY + 140, startX + 360, baseY + 40, endX, baseY + 80);
    ctx.stroke();
  

  // ripples
  ctx.strokeStyle = "rgba(252, 208, 96, 0.7)";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(canvas.width - 220, canvas.height - 80);
  ctx.lineTo(canvas.width - 60, canvas.height - 80);
  ctx.moveTo(canvas.width - 170, canvas.height - 50);
  ctx.lineTo(canvas.width - 30, canvas.height - 50);
  ctx.stroke();
  ctx.lineCap = "butt";
  
  }
  }
}
