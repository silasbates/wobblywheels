}

const customCarStorageKey = 'wobblyWheelsCustomCar';
const standardCarBallCount = 46;
let carBaseBallCount = standardCarBallCount;
let standardCarSpringCount = 1;
let survivalSpringCount = 1;
let isCustomCarActive = false;
const customCarCutY = 145;
let customCarData = null;

function copyCarBalls(source) {
    return source.map(ball => ({
        ...ball,
        spring: [...ball.spring],
        springDist: [...ball.springDist],
        anchor: Array.isArray(ball.anchor) ? [...ball.anchor] : ball.anchor
    }));
}

function isValidCustomCar(data) {
    return Array.isArray(data) && data.length >= 22 &&
        data.every(ball => ball && Number.isFinite(ball.x) && Number.isFinite(ball.y) &&
            Number.isFinite(ball.radias) && Array.isArray(ball.spring) &&
            Array.isArray(ball.springDist) && ball.spring.length === ball.springDist.length &&
            ball.spring.every(index => Number.isInteger(index) && index >= 0 && index < data.length));
}

function countSurvivalSprings() {
    return balls.reduce((count, ball, index) =>
        count + ball.spring.filter(targetIndex =>
            balls[targetIndex] && (index < 43 || targetIndex < 43)
        ).length, 0);
}

function applySelectedCarToCurrentGame() {
    if (!selectedCustomCar) {
        isCustomCarActive = false;
        carBaseBallCount = standardCarBallCount;
        survivalSpringCount = standardCarSpringCount;
        return;
    }
    balls = copyCarBalls(selectedCustomCar);
    carBaseBallCount = balls.filter(ball => !ball.customCarPoint).length;
    isCustomCarActive = true;
    survivalSpringCount = countSurvivalSprings();
}

function loadCustomCar() {
    try {
        const savedCar = localStorage.getItem(customCarStorageKey);
        if (!savedCar) return null;
        const parsedCar = JSON.parse(savedCar);
        if (!isValidCustomCar(parsedCar)) {
            console.error('Saved custom car data is invalid.');
            return null;
        }
        return parsedCar;
    } catch (error) {
        console.error('Could not load the saved custom car:', error);
        return null;
    }
}

function openCustomCarBuilder() {
    running = false;
    isCustomCarActive = true;
    makeCar();
    const savedCar = loadCustomCar();
    if (savedCar) {
        balls = copyCarBalls(savedCar);
        if (!balls.some(ball => ball.customCarPoint) && balls.length > standardCarBallCount) {
            balls.forEach((ball, index) => {
                if (index >= standardCarBallCount) ball.customCarPoint = true;
            });
        }
        if (balls.length >= standardCarBallCount &&
            !balls.slice(0, standardCarBallCount).some(ball => ball.customCarPoint)) {
            restoreCustomCarBaseShape(balls);
        }
    } else {
        customCarData = copyCarBalls(balls);
    }
    balls = removeCustomCarRoofPoints(balls);
    carBaseBallCount = balls.filter(ball => !ball.customCarPoint).length;
    carBalls = copyCarBalls(balls);
    customCarData = copyCarBalls(balls);
    const colorInput = document.getElementById('customCarColor');
    if (colorInput && /^#[0-9a-f]{6}$/i.test(carColor)) colorInput.value = carColor;
    setCarBuildTool('point');
}

function restoreCustomCarBaseShape(car) {
    const standardRoofHeights = [155, 135, 117, 102, 92, 87, 91, 96, 108, 126, 127, 123, 117];
    const roofStart = 31;
    if (car.length < roofStart + standardRoofHeights.length) return;
    standardRoofHeights.forEach((y, offset) => {
        car[roofStart + offset].y = y;
    });
    for (let index = roofStart; index < roofStart + standardRoofHeights.length; index++) {
        const point = car[index];
        point.spring.forEach((linkedIndex, springIndex) => {
            const linkedPoint = car[linkedIndex];
            if (!linkedPoint) return;
            const distance = getDistance(point.x, point.y, linkedPoint.x, linkedPoint.y);
            point.springDist[springIndex] = distance;
            const reciprocalIndex = linkedPoint.spring.indexOf(index);
            if (reciprocalIndex >= 0) linkedPoint.springDist[reciprocalIndex] = distance;
        });
    }
}

function removeCustomCarRoofPoints(car) {
    const keepIndex = car.map((ball, index) =>
        index < 22 || ball.customCarPoint || ball.y >= customCarCutY
    );
    const indexMap = new Map();
    let nextIndex = 0;
    keepIndex.forEach((keep, index) => {
        if (keep) indexMap.set(index, nextIndex++);
    });
    const keptBalls = car.filter((ball, index) => keepIndex[index]);
    keptBalls.forEach(ball => {
        const retainedSprings = [];
        const retainedDistances = [];
        ball.spring.forEach((linkedIndex, springIndex) => {
            const remappedIndex = indexMap.get(linkedIndex);
            if (remappedIndex === undefined) return;
            retainedSprings.push(remappedIndex);
            retainedDistances.push(ball.springDist[springIndex]);
        });
        ball.spring = retainedSprings;
        ball.springDist = retainedDistances;
    });
    return keptBalls;
}

    const pointIndex = isNearBall(x, y, 24, false, true);

        !/^#[0-9a-f]{6}$/i.test(color) || point.color === color) return false;

    carBalls = copyCarBalls(balls);
    return true;
}

function saveCustomCar() {

    customCarData = copyCarBalls(balls);
    try {
        localStorage.setItem(customCarStorageKey, JSON.stringify(customCarData));
        const status = document.getElementById('customBuildStatus');
        if (status) status.textContent = 'Car saved!';
    } catch (error) {
        console.error('Could not save the custom car:', error);
        const status = document.getElementById('customBuildStatus');
        if (status) status.textContent = 'Could not save the car. Try again!';
    }
}

function SyncFromSlider(key, val) {
  let num = parseFloat(val);
  if (key !== 'steepness' && key !== 'mapStep') {
    num = Math.round(num * 100000) / 100000;
  }
  updateGlobalState(key, num);
  
  
  
  const valInput = document.getElementById(key + `-val`);
  if (valInput) valInput.value = num;
}

function SyncFromInput(key, val) {
  let num = parseFloat(val);
  if (isNaN(num)) {
    num = (key === 'steepness') ? 500 : (key === 'mapStep') ? 200 : 0.5;
  }
  
  if (key === 'steepness') {
    if (num < 0) num = 0;
    if (num > 1000) num = 1000;
    num = Math.round(num);
  } else if (key === 'mapStep') {
    if (num < 100) num = 100;
    if (num > 300) num = 300;
    num = Math.round(num);
  } else if (key === 'brittleness') {
    if (num < 1.0) num = 1.0;
    if (num > 20) num = 20;
    num = Math.round(num);
  } else if (key === 'rain') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'lightning') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'astroid') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'avalanche') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else if (key === 'explode') {
    if (num < 0) num = 0;
    if (num > 10) num = 10;
    num = Math.round(num);
  } else {
    if (num < 0.00001) num = 0.00001;
    if (num > 0.999999) num = 0.999999;
    num = Math.round(num * 100000) / 100000;
  }
  
  updateGlobalState(key, num);
  const slider = document.getElementById(`${key}Slider`);
  const valInput = document.getElementById(`${key}-val`);
  if (slider) slider.value = num;
  if (valInput) valInput.value = num;
}

function updateGlobalState(key, value) {
  if (key === 'stiffness') inputStiffness = value;
  if (key === 'restitution') inputRestitution = value;
  if (key === 'friction') inputFriction = value;
  if (key === 'steepness') inputSteepness = value;
  if (key === 'mapStep') inputMapStep = value;
  if (key === 'brittleness') inputbrittleness = value;
  if (key === 'rain') inputRain = value;
  if (key === 'lightning') inputLightning = value;
  if (key === 'astroid') inputAstroid = value;
  if (key === 'avalanche') inputAvalanche = value;
  if (key === 'explode') inputExplode = value;
 
}

function preloadSound(file) {
    if (soundFileCache.has(file)) return soundFileCache.get(file);

    try {
        const cachedAudio = new Audio(file);
        cachedAudio.preload = 'auto';
        cachedAudio.addEventListener('error', () => {
            console.error(`Could not load sound file "${file}":`, cachedAudio.error);
        });
        cachedAudio.load();
        soundFileCache.set(file, cachedAudio);
        return cachedAudio;
    } catch (error) {
        console.error(`Could not initialize sound file "${file}":`, error);
        soundFileCache.set(file, null);
        return null;
    }
}

function playSound(file, volume = 1, playbackRate = 1, interruptCurrent = false, startOffset = 0) {
    const source = preloadSound(file);
    if (!source) return Promise.resolve(false);

    let audio = null;
    if (activeSoundAudio && !activeSoundAudio.paused && !activeSoundAudio.ended) {
        if (!interruptCurrent) return Promise.resolve(false);
        activeSoundAudio.pause();
        activeSoundAudio.currentTime = 0;
    }

    try {
        audio = source.cloneNode();
        audio.volume = Math.max(0, Math.min(volume, 1));
        audio.playbackRate = playbackRate;
        audio.preservesPitch = false;
        if (startOffset > 0) audio.currentTime = startOffset;
        activeSoundAudio = audio;
        const clearActiveSound = () => {
            if (activeSoundAudio === audio) activeSoundAudio = null;
        };
        audio.addEventListener('ended', clearActiveSound, { once: true });
        audio.addEventListener('error', clearActiveSound, { once: true });
        const playback = audio.play();
        if (playback && typeof playback.catch === 'function') {
            return playback.catch(error => {
                clearActiveSound();
                console.error(`Could not play sound file "${file}":`, error);
                return false;
            });
        }
        return Promise.resolve(true);
    } catch (error) {
        if (activeSoundAudio === audio) activeSoundAudio = null;
        console.error(`Could not play sound file "${file}":`, error);
        return Promise.resolve(false);
    }
}

function playEngineStartSound() {
    if (!engineStartAudio) return;

    const now = performance.now();
    if (now - lastEngineStartSoundTime < 250) return;
    lastEngineStartSoundTime = now;

    if (engineStartSoundFadeTimer !== null) {
        clearInterval(engineStartSoundFadeTimer);
        engineStartSoundFadeTimer = null;
    }
    if (!engineStartAudio.paused) engineStartAudio.pause();
    engineStartAudio.currentTime = 0;
    engineStartAudio.volume = engineStartSoundVolume;
    const playback = engineStartAudio.play();
    if (playback && typeof playback.catch === 'function') {
        playback.catch(error => {
            console.error(`Could not play sound file "${engineStartSoundFile}":`, error);
        });
    }
    engineStartSoundFadeTimer = setInterval(() => {
        const currentTime = engineStartAudio.currentTime;
        if (engineStartAudio.paused || currentTime >= engineStartSoundCutoff) {
            engineStartAudio.pause();
            engineStartAudio.currentTime = 0;
            engineStartAudio.volume = engineStartSoundVolume;
            clearInterval(engineStartSoundFadeTimer);
            engineStartSoundFadeTimer = null;
            return;
        }

        const fadeStart = engineStartSoundCutoff - engineStartSoundFadeDuration;
        if (currentTime >= fadeStart) {
            const fadeProgress = (currentTime - fadeStart) / engineStartSoundFadeDuration;
            engineStartAudio.volume = engineStartSoundVolume * (1 - fadeProgress);
        }
    }, 25);
}

function updateLoopSound(audio, file, shouldPlay, state) {
    if (!audio) return;
    state.requested = shouldPlay;

    if (!shouldPlay) {
        state.blocked = false;
        if (state.trimTimer !== null) {
            clearInterval(state.trimTimer);
            state.trimTimer = null;
        }
        if (!audio.paused) {
            audio.pause();
            audio.currentTime = 0;
        }
        return;
    }

    if (!audio.paused || state.pending || state.blocked) return;

    state.pending = true;
    try {
        if (state.startOffset && audio.currentTime < state.startOffset) {
            audio.currentTime = state.startOffset;
        }
        const playback = audio.play();
        if (playback && typeof playback.then === 'function') {
            playback.then(() => {
                state.pending = false;
                if (!state.requested) {
                    audio.pause();
                    audio.currentTime = 0;
                    return;
                }
                if (state.endTrim && state.trimTimer === null) {
                    state.trimTimer = setInterval(() => {
                        if (!state.requested || audio.paused || !Number.isFinite(audio.duration)) return;
                        if (audio.currentTime >= audio.duration - state.endTrim) {
                            audio.currentTime = state.startOffset || 0;
                        }
                    }, 20);
                }
            }).catch(error => {
                state.pending = false;
                if (!state.requested) return;
                state.blocked = true;
                console.error(`Could not play sound file "${file}":`, error);
            });
        } else {
            state.pending = false;
        }
    } catch (error) {
        state.pending = false;
        state.blocked = true;
        console.error(`Could not play sound file "${file}":`, error);
    }
}

function updateRocketThrusterSound(enabled) {
    const state = rocketThrusterSoundState;
    const shouldPlay = enabled && running;
    state.requested = shouldPlay;
    if (!rocketThrusterAudio) return;

    if (shouldPlay) {
        if (state.blocked) return;
        if (rocketThrusterAudio.paused && !state.pending) {
            state.pending = true;
            rocketThrusterAudio.volume = 0;
            const playback = rocketThrusterAudio.play();
            if (playback && typeof playback.then === 'function') {
                playback.then(() => {
                    state.pending = false;
                    if (!state.requested) {
                        rocketThrusterAudio.pause();
                        rocketThrusterAudio.currentTime = 0;
                        return;
                    }
                    fadeRocketThrusterVolume(rocketThrusterSoundVolume);
                }).catch(error => {
                    state.pending = false;
                    if (!state.requested) return;
                    state.blocked = true;
                    console.error(`Could not play sound file "${rocketThrusterSoundFile}":`, error);
                });
            } else {
                state.pending = false;
                fadeRocketThrusterVolume(rocketThrusterSoundVolume);
            }
        } else if (!rocketThrusterAudio.paused) {
            fadeRocketThrusterVolume(rocketThrusterSoundVolume);
        }
        return;
    }

    state.blocked = false;
    if (state.pending || rocketThrusterAudio.paused) return;
    fadeRocketThrusterVolume(0, () => {
        if (!state.requested) {
            rocketThrusterAudio.pause();
            rocketThrusterAudio.currentTime = 0;
        }
    });
}

function fadeRocketThrusterVolume(targetVolume, onComplete) {
    const state = rocketThrusterSoundState;
    if (state.targetVolume === targetVolume) {
        if (state.fadeTimer !== null) return;
        if (rocketThrusterAudio.volume === targetVolume) {
            if (onComplete) onComplete();
            return;
        }
    }
    if (state.fadeTimer !== null) {
        clearInterval(state.fadeTimer);
        state.fadeTimer = null;
    }
    state.targetVolume = targetVolume;
    const startVolume = rocketThrusterAudio.volume;
    const startTime = performance.now();
    state.fadeTimer = setInterval(() => {
        const progress = Math.min(1, (performance.now() - startTime) / (state.fadeDuration * 1000));
        const volume = startVolume + (targetVolume - startVolume) * progress;
        rocketThrusterAudio.volume = volume;
        state.volume = volume;
        if (progress >= 1) {
            clearInterval(state.fadeTimer);
            state.fadeTimer = null;
            if (onComplete) onComplete();
        }
    }, 20);
}

function startSpaceSoundTrack(index, outgoingIndex = -1) {
    const state = spaceSoundState;
    const audio = spaceSoundTracks[index];
    if (!audio || state.pending) return;

    state.pending = true;
    audio.pause();
    audio.currentTime = 0;
    audio.volume = 0;
    const playback = audio.play();
    const onStarted = () => {
        state.pending = false;
        if (!state.requested) {
            audio.pause();
            audio.currentTime = 0;
            return;
        }
        state.transition = {
            incomingIndex: index,
            outgoingIndex,
            startedAt: performance.now()
        };
    };
    if (playback && typeof playback.then === 'function') {
        playback.then(onStarted).catch(error => {
            state.pending = false;
            if (!state.requested) return;
            state.blocked = true;
            console.error(`Could not play sound file "${spaceSoundFile}":`, error);
        });
    } else {
        onStarted();
    }
}

function stopSpaceSoundTrack(index) {
    const audio = spaceSoundTracks[index];
    if (!audio) return;
    audio.pause();
    audio.currentTime = 0;
    audio.volume = 0;
}

function updateSpaceSound() {
    const state = spaceSoundState;
    state.requested = Boolean(m.space) && running;

    if (!state.requested) {
        state.blocked = false;
        if (state.currentTrack < 0 && !state.transition) {
            if (state.timer !== null) {
                clearInterval(state.timer);
                state.timer = null;
            }
            return;
        }
        if (state.transition && (state.transition.incomingIndex >= 0 || !state.transition.duration)) {
            const transition = state.transition;
            state.transition = {
                incomingIndex: -1,
                outgoingIndex: transition.incomingIndex >= 0 ? transition.incomingIndex : state.currentTrack,
                extraOutgoingIndex: transition.outgoingIndex,
                startedAt: performance.now(),
                duration: 0.35
            };
        } else if (!state.transition && state.currentTrack >= 0) {
            state.transition = {
                incomingIndex: -1,
                outgoingIndex: state.currentTrack,
                startedAt: performance.now(),
                duration: 0.35
            };
        }
    } else if (!state.blocked && state.currentTrack < 0 && !state.pending && !state.transition) {
        startSpaceSoundTrack(0);
    }

    if (state.timer === null && (state.requested || state.transition)) {
        state.timer = setInterval(() => {
            if (state.transition) {
                const transition = state.transition;
                const duration = transition.duration || spaceSoundCrossfadeDuration;
                const progress = Math.min(1, (performance.now() - transition.startedAt) / (duration * 1000));
                if (transition.outgoingIndex >= 0) {
                    spaceSoundTracks[transition.outgoingIndex].volume = spaceSoundVolume * (1 - progress);
                }
                if (transition.extraOutgoingIndex >= 0) {
                    spaceSoundTracks[transition.extraOutgoingIndex].volume = spaceSoundVolume * (1 - progress);
                }
                if (transition.incomingIndex >= 0) {
                    spaceSoundTracks[transition.incomingIndex].volume = spaceSoundVolume * progress;
                }
                if (progress >= 1) {
                    if (transition.outgoingIndex >= 0) stopSpaceSoundTrack(transition.outgoingIndex);
                    if (transition.extraOutgoingIndex >= 0) stopSpaceSoundTrack(transition.extraOutgoingIndex);
                    state.currentTrack = transition.incomingIndex;
                    state.transition = null;
                }
            }

            if (state.requested && !state.blocked && !state.pending && !state.transition && state.currentTrack >= 0) {
                const audio = spaceSoundTracks[state.currentTrack];
                const remaining = audio.duration - audio.currentTime;
                if (Number.isFinite(remaining) && remaining <= spaceSoundCrossfadeDuration) {
                    startSpaceSoundTrack(1 - state.currentTrack, state.currentTrack);
                }
            }

            if (!state.requested && !state.pending && !state.transition && state.currentTrack < 0) {
                clearInterval(state.timer);
                state.timer = null;
            }
        }, 25);
    }
}

function initializeDriveSound() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) {
        console.error('Drive sound is unavailable because this browser does not support Web Audio.');
        return;
    }

    if (!driveAudioContext) {
        driveAudioContext = new AudioContextClass();
        driveOscillator = driveAudioContext.createOscillator();
        driveHarmonic = driveAudioContext.createOscillator();
        driveFilter = driveAudioContext.createBiquadFilter();
        driveGain = driveAudioContext.createGain();
        driveHarmonicGain = driveAudioContext.createGain();
        driveNoise = driveAudioContext.createBufferSource();
        driveNoiseFilter = driveAudioContext.createBiquadFilter();
        driveNoiseGain = driveAudioContext.createGain();
        const noiseBuffer = driveAudioContext.createBuffer(1, driveAudioContext.sampleRate * 2, driveAudioContext.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseData.length; i++) {
            noiseData[i] = (Math.random() * 2 - 1) * 0.18;
        }

        driveOscillator.type = 'sawtooth';
        driveOscillator.frequency.value = 14;
        driveHarmonic.type = 'triangle';
        driveHarmonic.frequency.value = 65;
        driveFilter.type = 'lowpass';
        driveFilter.frequency.value = 180;
        driveGain.gain.value = 0;
        driveHarmonicGain.gain.value = 0.22;
        driveNoise.buffer = noiseBuffer;
        driveNoise.loop = true;
        driveNoiseFilter.type = 'bandpass';
        driveNoiseFilter.frequency.value = 850;
        driveNoiseFilter.Q.value = 0.7;
        driveNoiseGain.gain.value = 0;

        driveOscillator.connect(driveFilter);
        driveHarmonic.connect(driveHarmonicGain);
        driveHarmonicGain.connect(driveFilter);
        driveFilter.connect(driveGain);
        driveGain.connect(driveAudioContext.destination);
        driveNoise.connect(driveNoiseFilter);
        driveNoiseFilter.connect(driveNoiseGain);
        driveNoiseGain.connect(driveAudioContext.destination);
        driveOscillator.start();
        driveHarmonic.start();
        driveNoise.start();
    }
}


function playCrashSound(impactSpeed) {
    if (impactSpeed < 2) return;
    const now = performance.now();
    if (now - lastCrashSoundTime < 160) return;
    lastCrashSoundTime = now;

    playSound(crashSoundFile, 0.18 + Math.min(impactSpeed / 18, 1) * 0.62);
}

let lastSpringSnapSoundTime = 0;

function playSpringSnapSound(strain) {
    const soundRoll = Math.random();
    const playChance = strain < 1.5 ? 0.1 : 0.5;
    if (soundRoll >= playChance) return;

    const now = performance.now();
    if (now - lastSpringSnapSoundTime < 300) return;
    lastSpringSnapSoundTime = now;

    const sound = strain >= 2.5
        ? springSnapSoundFiles.large
        : strain >= 1.5
            ? springSnapSoundFiles.medium
            : springSnapSoundFiles.small;
    const volume = Math.min(0.9, 0.45 + Math.max(0, strain - 1) * 0.18);
    const randomPlaybackRate = 0.8 + Math.random() * 0.4;
    playSound(sound, volume, randomPlaybackRate);
}

function playCarImpactSound(impactSpeed) {
    if (impactSpeed < 2) return;

    const now = performance.now();
    if (now - lastSpringSnapSoundTime < 300) return;

    const isSmallImpact = impactSpeed < 5;
    if (Math.random() >= (isSmallImpact ? 0.1 : 0.5)) return;
    lastSpringSnapSoundTime = now;

    const sound = impactSpeed >= 10
        ? springSnapSoundFiles.large
        : impactSpeed >= 5
            ? springSnapSoundFiles.medium
            : springSnapSoundFiles.small;
    const volume = Math.min(0.9, 0.35 + impactSpeed / 24);
    const randomPlaybackRate = 0.8 + Math.random() * 0.4;
    playSound(sound, volume, randomPlaybackRate);
}

document.addEventListener('pointerdown', initializeDriveSound, { once: true });

function updateDriveSound() {
    if (!driveAudioContext || !driveGain || !driveOscillator || !driveHarmonic || !driveFilter || !driveNoiseGain || !driveNoiseFilter) return;

    const throttle = isLeftPressed || isRightPressed || driveLeft || driveRight;
    let speed = 0;
    if (balls && balls[11] && balls[21]) {
        speed = (Math.hypot(balls[11].xVel, balls[11].yVel) + Math.hypot(balls[21].xVel, balls[21].yVel)) / 2;
    }
    const rpm = 48 + Math.min(speed, 50) * 2.2 + (throttle ? 24 : 0);
    const now = driveAudioContext.currentTime;
    driveGain.gain.setTargetAtTime(running && throttle ? 0.03 : 0, now, 0.06);
    driveOscillator.frequency.setTargetAtTime(rpm, now, 0.16);
    driveHarmonic.frequency.setTargetAtTime(rpm * 2.01, now, 0.16);
    driveFilter.frequency.setTargetAtTime(260 + Math.min(speed, 50) * 18 + (throttle ? 350 : 0), now, 0.14);
    driveNoiseGain.gain.setTargetAtTime(running && throttle ? 0.006 : 0, now, 0.12);
    driveNoiseFilter.frequency.setTargetAtTime(700 + Math.min(speed, 50) * 20, now, 0.16);
}

    const active = [...mobileControlPointers.values()];
    driveRight = active.includes('left');
    driveLeft = active.includes('right');
    isActionPressed = m.rocket && active.includes('action');
    updateRocketThrusterSound(isActionPressed);
}

function setMobileControl(control, pressed, event) {
    event.preventDefault();
    if (pressed) {
        if (control === 'left' || control === 'right') initializeDriveSound();
        event.currentTarget.setPointerCapture(event.pointerId);
        mobileControlPointers.set(event.pointerId, control);
    } else {
        mobileControlPointers.delete(event.pointerId);
    }
    event.currentTarget.classList.toggle('pressed', pressed);
    updateMobileControlStates();
}

    if (e.code === 'Space' && m.rocket) {

function rocketThruster(enabled = false) {
    const isThrusting = m.rocket && enabled === true;
    updateRocketThrusterSound(isThrusting);
    if (!m.rocket || !balls || !balls[11] || !balls[21]) return;

    const rearWheel = balls[11];
    const frontWheel = balls[21];
    const rearBodyTop = balls[22];
    const rearBodyBottom = balls[43];
    const rear = rearBodyTop && rearBodyBottom
        ? { x: (rearBodyTop.x + rearBodyBottom.x) / 2, y: (rearBodyTop.y + rearBodyBottom.y) / 2 }
        : rearWheel;
    const axisX = frontWheel.x - rearWheel.x;
    const axisY = frontWheel.y - rearWheel.y;
    const axisLength = Math.hypot(axisX, axisY);
    if (axisLength === 0) return;

    const forwardX = axisX / axisLength;
    const forwardY = axisY / axisLength;
    const sideX = -forwardY;
    const sideY = forwardX;
    const mountX = rear.x - forwardX * 7.5;
    const mountY = rear.y - forwardY * 7.5;

    if (isThrusting && running) {
        for (let i = 0; i < Math.min(47, balls.length); i++) {
            const ball = balls[i];
            if (!ball.anchor && typeof ball.xVel === "number") {
                ball.xVel += forwardX * 0.18;
                ball.yVel += forwardY * 0.18;
            }
        }
    }

    const point = (forward, side) => ({
        x: ScrollX(mountX + forwardX * forward + sideX * side),
        y: ScrollY(mountY + forwardY * forward + sideY * side)
    });
    const drawPolygon = (points, color) => {

let neptuneWind = 0
function drawNeptuneWinds() {
    let canvasWidth = canvas.width;
    let canvasHeight = canvas.height;

    if (!this.windParticles) {
        this.windParticles = [];
        for (let i = 0; i < 250; i++) {
            this.windParticles.push({
                x: Math.random() * canvasWidth,
                y: Math.random() * canvasHeight,
                length: Math.random() * 500 + 300,
                speed: Math.random() * 60 + 40,
                opacity: Math.random() * 0.6 + 0.4,
                thickness: Math.random() * 8 + 4
            });
        }
    }

    let sineIntensity = (Math.sin(time * 0.02) + 1) / 2;
	neptuneWind = sineIntensity
    if (sineIntensity > 0.01) {
        let totalBlockAlpha = sineIntensity >= 0.98 ? 1.0 : sineIntensity * 0.75;
        ctx.fillStyle = `rgba(0, 45, 115, ${totalBlockAlpha})`;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        for (let i = 0; i < this.windParticles.length; i++) {
            let p = this.windParticles[i];
            
            let gradient = ctx.createLinearGradient(p.x, p.y, p.x + p.length, p.y);
            gradient.addColorStop(0, `rgba(30, 144, 255, 0)`);
            gradient.addColorStop(0.3, `rgba(135, 206, 250, ${p.opacity * sineIntensity})`);
            gradient.addColorStop(0.7, `rgba(255, 255, 255, ${p.opacity * 0.9 * sineIntensity})`);
            gradient.addColorStop(1, `rgba(0, 102, 204, 0)`);

            ctx.strokeStyle = gradient;
            ctx.lineWidth = p.thickness;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.length, p.y);
            ctx.stroke();

            p.x += p.speed;

            if (p.x > canvasWidth) {
                p.x = -p.length;
                p.y = Math.random() * canvasHeight;
            }
        }
    }
}

let marsWindCanvasSize = "";

function getMarsWindDirection() {
    return Math.sin(time / 120) >= 0 ? 1 : -1;
}

function drawMarsWind() {
    const canvasSize = `canvas.widthx{canvas.height}`;
    if (canvasSize !== marsWindCanvasSize) {
        marsWindCanvasSize = canvasSize;
        const streakCount = Math.max(20, Math.min(180, Math.ceil(canvas.width * canvas.height / 12000)));
        marsWindStreaks = Array.from({ length: streakCount }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: 20 + Math.random() * 70,
            speed: 2 + Math.random() * 3,
            opacity: 0.25 + Math.random() * 0.4
        }));
    }

    ctx.save();
    ctx.lineWidth = 2;
    const direction = getMarsWindDirection();
    for (const streak of marsWindStreaks) {
        streak.x += streak.speed * direction;
        if (direction > 0 && streak.x > canvas.width) {
            streak.x = -streak.length;
            streak.y = Math.random() * canvas.height;
        } else if (direction < 0 && streak.x + streak.length < 0) {
            streak.x = canvas.width;
            streak.y = Math.random() * canvas.height;
        }
        ctx.strokeStyle = `rgba(255, 255, 255, ${streak.opacity})`;
        ctx.beginPath();
        ctx.moveTo(streak.x, streak.y);
        ctx.lineTo(streak.x + streak.length, streak.y);
        ctx.stroke();
    }
    ctx.restore();
}

        }

        function makeRope(x1, y1, x2, y2, gap) {
    const dist = getDistance(x1, y1, x2, y2);
    // Determine how many balls fit in this distance
    const steps = Math.floor(dist / gap);
   
    // Calculate the normalized step for x and y
    const dx = (x2 - x1) / steps;
    const dy = (y2 - y1) / steps;
    let lastBallIndex = null;
    for (let i = 0; i <= steps; i++) {
        // Calculate current position
        const currX = x1 + (dx * i);
        const currY = y1 + (dy * i);
        const newBall = {
            x: currX,
            y: currY,
            xVel: 0,
            yVel: 0,
            radias: ballRadias,
            spring: lastBallIndex === null ?  [isNearBall(ropeX, ropeY, 50, false, true)] : [lastBallIndex],
            springDist: [gap],
            anchor: false
        };




        balls.push(newBall);
       
        // The index of the ball we just added
        const currentIdx = balls.length - 1;


        // Link the previous ball to this new ball (bidirectional spring)
        if (lastBallIndex !== null) {
            balls[lastBallIndex].spring.push(currentIdx);
            balls[lastBallIndex].springDist.push(gap);
        }




        lastBallIndex = currentIdx;
    }
}

    const dx = ball1.x - ball2.x;
    const dy = ball1.y - ball2.y;
    const distance = Math.hypot(dx, dy);
    const minDistance = ball1.radias + ball2.radias;
    if (distance < minDistance && distance > 0) {
        const overlap = minDistance - distance;
        const nx = dx / distance;
        const ny = dy / distance;
	

        if (ball1.xVel !== "anchor") {
            ball1.x += nx * overlap * 0.5;
            ball1.y += ny * overlap * 0.5;
        }

            ball2.x -= nx * overlap * 0.5;
            ball2.y -= ny * overlap * 0.5;
        }
        const v1x = ball1.xVel === "anchor" ? 0 : ball1.xVel;
        const v1y = ball1.yVel === "anchor" ? 0 : ball1.yVel;
        const v2x = ball2.xVel === "anchor" ? 0 : ball2.xVel;
        const v2y = ball2.yVel === "anchor" ? 0 : ball2.yVel;
        const relVelX = v1x - v2x;
        const relVelY = v1y - v2y;
        const velAlongNormal = (relVelX * nx) + (relVelY * ny);
        if (velAlongNormal > 0) return;
        const impulse = -(1 + restitution) * velAlongNormal / 2;

function parseTriangleColor(color) {
    triangleColorContext.fillStyle = '#000000';
    triangleColorContext.fillStyle = color || '#000000';
    const normalized = triangleColorContext.fillStyle;
    const hexMatch = normalized.match(/^#([0-9a-f]{6})$/i);
    if (hexMatch) {
        const value = parseInt(hexMatch[1], 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
    }
    const rgbMatch = normalized.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    return rgbMatch ? [Number(rgbMatch[1]), Number(rgbMatch[2]), Number(rgbMatch[3])] : [0, 0, 0];
}

function drawSpringTriangleGradient(first, second, third, indices) {
    if (indices.some(index => index === 11 || index === 21 || !balls[index]) ||
        indices.some(index => balls[index].color === 'black')) return;
    const key = [...indices].sort((a, b) => a - b).join(':');
    if (renderedSpringTriangles.has(key)) return;
    renderedSpringTriangles.add(key);

    const points = [first, second, third].map(ball => ({
        x: ScrollX(ball.x),
        y: ScrollY(ball.y),
        color: ball.color || 'black'
    }));
    const center = {
        x: (points[0].x + points[1].x + points[2].x) / 3,
        y: (points[0].y + points[1].y + points[2].y) / 3
    };
    const area = (points[1].x - points[0].x) * (points[2].y - points[0].y) -
        (points[1].y - points[0].y) * (points[2].x - points[0].x);
    if (Math.abs(area) < 0.01) return;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.lineTo(points[2].x, points[2].y);
    ctx.closePath();
    ctx.clip();

    const colors = points.map(point => parseTriangleColor(point.color));
    const centerColor = `rgb(${[0, 1, 2].map(channel =>
        Math.round((colors[0][channel] + colors[1][channel] + colors[2][channel]) / 3)
    ).join(',')})`;
    for (let index = 0; index < 3; index++) {
        const start = points[index];
        const end = points[(index + 1) % 3];
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.lineTo(center.x, center.y);
        ctx.closePath();
        ctx.clip();
        const gradient = ctx.createLinearGradient(start.x, start.y, center.x, center.y);
        gradient.addColorStop(0, start.color);
        gradient.addColorStop(1, centerColor);
        ctx.fillStyle = gradient;
        ctx.fillRect(
            Math.min(start.x, end.x, center.x),
            Math.min(start.y, end.y, center.y),
            Math.max(start.x, end.x, center.x) - Math.min(start.x, end.x, center.x),
            Math.max(start.y, end.y, center.y) - Math.min(start.y, end.y, center.y)
        );
        ctx.restore();
    }
    ctx.restore();
    [first, second, third].forEach((ball, index) => {
        ctx.fillStyle = points[index].color;
        ctx.beginPath();
        const radius = getCarBallRadius(ball);
        ctx.arc(points[index].x, points[index].y, radius, 0, 2 * Math.PI);
        ctx.fill();
    });
}

    let startIdx = balls.length;                                      
   
    // Variable to easily control the joint and limb radius    
    let rad = 5;                                    
   
    // Helper function to return a fresh random red hue variation for each single node    
    function getRandomRed(testDummyColor = false) {        
        let randomLightness = Math.floor(Math.random() * 101);        
       
        if (testDummyColor) {
            return "hsl(69, 100%, " + randomLightness / 2 + "%)";    
        }
         
        return "hsl(0, 100%, " + randomLightness / 2 + "%)";    
    }                                    
   
    // -------------------------------------------------------------    
    // 1. SPAWN THE STICKMAN NODE BLOCKS (Using the rad variable)    
    // -------------------------------------------------------------                                    
    // Index 0: Head (Scales up dynamically relative to the body joints)    
    balls.push({ x: startX, y: startY - 70, xVel: startXVel, yVel: startYVel, radias: rad * 3.5, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});          
   
    // Index 1: Neck/Chest    
    balls.push({ x: startX, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad + 2, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
   
    // Index 2: Lower Torso/Hips    
    balls.push({ x: startX, y: startY,       xVel: startXVel, yVel: startYVel, radias: rad + 2, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});                                    
   
    // Left Arm (Index 3: Shoulder, Index 4: Elbow, Index 5: Hand)    
    balls.push({ x: startX - 25, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
    balls.push({ x: startX - 50, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
    balls.push({ x: startX - 75, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});                                    
   
    // Right Arm (Index 6: Shoulder, Index 7: Elbow, Index 8: Hand)    
    balls.push({ x: startX + 25, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
    balls.push({ x: startX + 50, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
    balls.push({ x: startX + 75, y: startY - 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});                                    
   
    // Left Leg (Index 9: Knee, Index 10: Foot)    
    balls.push({ x: startX - 20, y: startY + 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
    balls.push({ x: startX - 20, y: startY + 80, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});                                    
   
    // Right Leg (Index 11: Knee, Index 12: Foot)    
    balls.push({ x: startX + 20, y: startY + 40, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});    
    balls.push({ x: startX + 20, y: startY + 80, xVel: startXVel, yVel: startYVel, radias: rad, radians: 0, spring: [], springDist: [], anchor: false, color: getRandomRed(testDummy), deadFire: false});                                    
   
    // -------------------------------------------------------------    
    // 2. CONNECT RELATIVE JOINTS (Populates spring & springDist together)    
    // -------------------------------------------------------------    
    function link(relA, relB, targetDistance) {        
        let a = startIdx + relA;        
        let b = startIdx + relB;        
        balls[a].spring.push(b);        
        balls[a].springDist.push(targetDistance);        
        balls[b].spring.push(a);        
        balls[b].springDist.push(targetDistance);    
    }                                    
   
    link(0, 1, 30); // Head to Chest    
    link(1, 2, 40); // Chest to Pelvis    
    link(1, 3, 25); // Left Arm    
    link(3, 4, 25);      
    link(4, 5, 25);      
    link(1, 6, 25); // Right Arm    
    link(6, 7, 25);      
    link(7, 8, 25);      
    link(2, 9, 40); // Left Leg    
    link(9, 10, 40);      
    link(2, 11, 40); // Right Leg    
    link(11, 12, 40);                                    
   
    // Advance target pointer to point to the next spawned stickman's neck node
    if (testDummy) return
    // under this is stuff only for normal dummys
    otherVeiw = startIdx;        
}

function deleteBall(ballIndex) {
    for (let b of balls) {
        for (let i = b.spring.length - 1; i >= 0; i--) {
            if (b.spring[i] === ballIndex) {
                b.spring.splice(i, 1);
                b.springDists.splice(i, 1);
            } else if (b.spring[i] > ballIndex) {
                b.spring[i]--;
            }
        }
    }

    if (target > ballIndex) {
        target--;
    }
    if (otherVeiw > ballIndex) {
        otherVeiw--;
    }

    balls.splice(ballIndex, 1);
}

function drawBg(CTX = ctx, CANVAS = canvas) {
  /*// 1. Handle Scrolling and Infinite Loop Physics
  distanceBg -= (speed - 0.3045) * 3;
  if (distanceBg - 540 < -540) {
    distanceBg -= Math.floor((distanceBg - 540) / -540) * -540;
  }
  */

  const mountainData = [
    { color: m.mountainColors[0], x1: -20, x2: 60, x3: 140, h: 80},
    { color: m.mountainColors[1], x1: 80, x2: 160, x3: 240, h: 110},
    { color: m.mountainColors[2], x1: 180, x2: 270, x3: 360, h: 75},
    { color: m.mountainColors[3], x1: 300, x2: 400, x3: 500, h: 130},
    { color: m.mountainColors[4], x1: 420, x2: 510, x3: 600, h: 95}
  ];

  // sky
  let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
  const isZeroGravitySky = m.name === "zero gravity";
  const targetSkyBlend = isZeroGravitySky && noGravity > 0 ? 1 : 0;
  zeroGravitySkyBlend += (targetSkyBlend - zeroGravitySkyBlend) * 0.06;
  const blendSkyColor = (baseColor, purpleColor) => {
    const base = Number.parseInt(baseColor.slice(1), 16);
    const purple = Number.parseInt(purpleColor.slice(1), 16);
    const channel = shift => Math.round(
      ((base >> shift) & 255) * (1 - zeroGravitySkyBlend) +
      ((purple >> shift) & 255) * zeroGravitySkyBlend
    );
    return `rgb(${channel(16)}, ${channel(8)}, ${channel(0)})`;
  };
  const skyColor = isZeroGravitySky ? blendSkyColor(m.skyColor, "#32104f") : m.skyColor;
  const sunsetColor = isZeroGravitySky ? blendSkyColor(m.sunsetColor, "#8a3db5") : m.sunsetColor;
  skyGradient.addColorStop(0, skyColor);
  //skyGradient.addColorStop(0.4, "#73aed9");
  //skyGradient.addColorStop(0.75, "#f79e45");
  skyGradient.addColorStop(0.85, sunsetColor);
  skyGradient.addColorStop(1, sunsetColor);
  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
		
  // sun
  if (m.drawSun) {
  ctx.fillStyle = '#ffb';
  ctx.strokeStyle = "black";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(canvas.width - 120, (canvas.height / 2) - 100, 50, 0, 2 * Math.PI);
  ctx.fill();
  ctx.stroke();
	}
  ctx.lineJoin = "round";
  const baseY = canvas.height / 2 + 15;
  const offsets = [];

  for (let offset = -540; offset < canvas.width; offset += 540) {
    offsets.push(offset);
  }

  // mountains
  for (let offset of offsets) {
    for (let m of mountainData) {
      ctx.fillStyle = m.color;
      ctx.strokeStyle = "black";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0 + m.x1 + offset, baseY);
      ctx.lineTo(0 + m.x2 + offset, baseY - m.h);
      ctx.lineTo(0 + m.x3 + offset, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  // ground
  ctx.fillStyle = m.grassColor;
  ctx.fillRect(0, baseY, canvas.width, canvas.height - baseY);

  // horizon
  ctx.strokeStyle = "black";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.lineTo(canvas.width, baseY);
  ctx.stroke();

  for (let offset of offsets) {
    const startX = 0 + offset;
    const endX = 540 + offset;
    // shore
    if (m.drawShore) {
    	ctx.fillStyle = m.sandColor;
    	ctx.beginPath();
    	ctx.moveTo(startX, baseY + 30);
    	ctx.bezierCurveTo(
      	startX + 180, baseY + 90,
      	startX + 360, baseY - 10,
     		endX, baseY + 30
    	);
    	ctx.lineTo(endX, canvas.height);
    	ctx.lineTo(startX, canvas.height);
    	ctx.closePath();
    	ctx.fill();
    	ctx.strokeStyle = "black";
    	ctx.lineWidth = 5;
   		ctx.beginPath();
    	ctx.moveTo(startX, baseY + 30);
    	ctx.bezierCurveTo(startX + 180, baseY + 90, startX + 360, baseY - 10, 	endX, baseY + 30);
    	ctx.stroke();
    }

    // water
	if (m.waterColor) {
    let lakeGradient = ctx.createLinearGradient(0, baseY + 80, 0, canvas.height);
    lakeGradient.addColorStop(0, m.waterColor);
    ctx.fillStyle = lakeGradient;
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 90);
    ctx.bezierCurveTo(
      startX + 180, baseY + 150,
      startX + 360, baseY + 50,
      endX, baseY + 90
    );
    ctx.lineTo(endX, canvas.height);
    ctx.lineTo(startX, canvas.height);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "black";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 90);
    ctx.bezierCurveTo(startX + 180, baseY + 150, startX + 360, baseY + 50, endX, baseY + 90);
    ctx.stroke();
	
    // wave
    ctx.fillStyle = "rgba(78, 182, 194, 0.45)";
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 80);
    ctx.bezierCurveTo(
      startX + 180, baseY + 140,
      startX + 360, baseY + 40,
      endX, baseY + 80
    );
    ctx.lineTo(endX, canvas.height);
    ctx.lineTo(startX, canvas.height);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(startX, baseY + 80);
    ctx.bezierCurveTo(startX + 180, baseY + 140, startX + 360, baseY + 40, endX, baseY + 80);
    ctx.stroke();
  

  // ripples
  ctx.strokeStyle = "rgba(252, 208, 96, 0.7)";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(canvas.width - 220, canvas.height - 80);
  ctx.lineTo(canvas.width - 60, canvas.height - 80);
  ctx.moveTo(canvas.width - 170, canvas.height - 50);
  ctx.lineTo(canvas.width - 30, canvas.height - 50);
  ctx.stroke();
  ctx.lineCap = "butt";
  
  }
  }
  if (garage) {
  	drawGarage()
  }
}
drawbg = true;
drawingInput = 'drive'
//gravity = 0.2
    </script>
</body> 
</html>
